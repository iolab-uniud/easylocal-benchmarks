name: Benchmarks

# EasyLocal 4 against EasyLocal 3 on the example problems, and the EasyLocal
# infrastructure benchmarks; results committed to results/.
#
# - EasyLocal 3 (easylocal-legacy v3.3.1) is measured once per EasyLocal 3 key
#   (scripts/el3-vs-el4.py key --el3); otherwise the stored baseline is reused.
# - EasyLocal 4 is measured at the release that started the run, with the
#   infrastructure benchmarks of infrastructure/.
#
# Secrets: EASYLOCAL_TOKEN (optional), a token allowed to start workflows of
# iolab-uniud/easylocal, to rebuild its documentation after a publication.

on:
  repository_dispatch:
    types: [easylocal-release]
  workflow_dispatch:
    inputs:
      easylocal_ref:
        description: 'EasyLocal tag, branch or commit to measure'
        type: string
        default: main
      label:
        description: 'Label of the EasyLocal 4 results (default: the tag, or <ref>-<commit>)'
        type: string
        default: ''
      publish:
        description: 'Commit the results'
        type: boolean
        default: false
      remeasure_el3:
        description: 'Measure EasyLocal 3 even if a baseline is stored'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: benchmarks
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TOOLCHAIN: gcc16
  CXX: /usr/bin/g++-16
  EASYLOCAL_REF: ${{ github.event.client_payload.ref || inputs.easylocal_ref || 'main' }}

jobs:
  el3:
    name: EasyLocal 3 baseline
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    outputs:
      key: ${{ steps.key.outputs.key }}
      measured: ${{ steps.stored.outputs.measure }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: EasyLocal 3 key
        id: key
        run: echo "key=$(python3 scripts/el3-vs-el4.py key --el3 --toolchain "$TOOLCHAIN")" >> "$GITHUB_OUTPUT"

      - name: Look for a stored baseline
        id: stored
        env:
          KEY: ${{ steps.key.outputs.key }}
          REMEASURE: ${{ inputs.remeasure_el3 }}
        run: |
          measure=true
          if [ "$REMEASURE" != true ] && [ -f "results/el3/$KEY/results.csv" ]; then
            measure=false
          fi
          echo "measure=$measure" >> "$GITHUB_OUTPUT"
          echo "EasyLocal 3 key $KEY: measure=$measure"

      - name: Install the toolchain
        if: ${{ steps.stored.outputs.measure == 'true' }}
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get install -y --no-install-recommends \
              cmake ninja-build g++-16 libboost-program-options-dev

      - name: Build the EasyLocal 3 driver
        if: ${{ steps.stored.outputs.measure == 'true' }}
        run: |
          mkdir -p build
          curl -fsSL https://github.com/iolab-uniud/easylocal-legacy/archive/refs/tags/v3.3.1.tar.gz \
            | tar -xz -C build
          cmake -S el3_vs_el4/el3 -B build/el3 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DEL3_SOURCE_DIR="$PWD/build/easylocal-legacy-3.3.1"
          cmake --build build/el3 --parallel 2

      - name: Run the matrix
        if: ${{ steps.stored.outputs.measure == 'true' }}
        run: |
          python3 scripts/el3-vs-el4.py run --framework el3 \
            --driver build/el3/el3_comparison \
            --output build/results/el3 \
            --toolchain "$TOOLCHAIN" --label el3

      - name: Upload the results
        if: ${{ steps.stored.outputs.measure == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: el3-results
          retention-days: 30
          path: |
            build/results/el3/results.csv
            build/results/el3/metadata.json

  el4:
    name: EasyLocal 4
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    outputs:
      label: ${{ steps.label.outputs.label }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout EasyLocal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: iolab-uniud/easylocal
          ref: ${{ env.EASYLOCAL_REF }}
          path: easylocal
          persist-credentials: false

      - name: Label
        id: label
        env:
          INPUT_LABEL: ${{ inputs.label }}
        run: |
          commit="$(git -C easylocal rev-parse --short HEAD)"
          if [ -n "$INPUT_LABEL" ]; then
            label="$INPUT_LABEL"
          elif git -C easylocal tag --points-at HEAD | grep -qx "$EASYLOCAL_REF"; then
            label="$EASYLOCAL_REF"
          else
            label="${EASYLOCAL_REF//\//-}-$commit"
          fi
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "EasyLocal $EASYLOCAL_REF ($commit): $label"

      - name: Install the toolchain
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get install -y --no-install-recommends cmake ninja-build g++-16

      - name: Build the EasyLocal 4 driver
        run: |
          cmake -S el3_vs_el4/el4 -B build/el4 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DEASYLOCAL_SOURCE_DIR="$PWD/easylocal"
          cmake --build build/el4 --parallel 2

      - name: Run the matrix
        env:
          LABEL: ${{ steps.label.outputs.label }}
        run: |
          python3 scripts/el3-vs-el4.py run --framework el4 \
            --driver build/el4/el4_comparison \
            --output build/results/el4/comparison \
            --toolchain "$TOOLCHAIN" --label "$LABEL"

      - name: Infrastructure benchmarks
        run: |
          results="$PWD/build/results/el4/infrastructure"
          build="$PWD/build/infrastructure"
          EASYLOCAL_SOURCE_DIR="$PWD/easylocal" BENCHMARK_BUILD_DIR="$build" \
            ./scripts/run-neighborhood-benchmarks.sh "$results" 1000000 3 123456789
          cmake --build "$build" --target easylocal_trace_benchmark
          echo 'trial,mode,ns_per_evaluation,checksum' > "$results/trace.csv"
          for trial in 1 2 3 4 5; do
            "$build/easylocal_trace_benchmark" 2>> "$results/trace.log" \
              | tail -n +2 | sed "s/^/$trial,/" >> "$results/trace.csv"
          done

      - name: Upload the results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: el4-results
          retention-days: 30
          path: |
            build/results/el4/comparison/results.csv
            build/results/el4/comparison/metadata.json
            build/results/el4/infrastructure/*.csv

  publish:
    name: Publish
    needs: [el3, el4]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write  # results/
    env:
      KEY: ${{ needs.el3.outputs.key }}
      MEASURED_EL3: ${{ needs.el3.outputs.measured }}
      LABEL: ${{ needs.el4.outputs.label }}
      PUBLISH: ${{ github.event_name == 'repository_dispatch' || inputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: build/artifacts

      - name: Add them to results/
        run: |
          if [ "$MEASURED_EL3" = true ]; then
            rm -rf "results/el3/$KEY"
            mkdir -p "results/el3/$KEY"
            cp build/artifacts/el3-results/* "results/el3/$KEY/"
          fi
          rm -rf "results/el4/$LABEL"
          mkdir -p "results/el4/$LABEL"
          cp -R build/artifacts/el4-results/* "results/el4/$LABEL/"
          python3 scripts/summarize.py results --output build/benchmarks.md
          cat build/benchmarks.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the results
        if: ${{ env.PUBLISH == 'true' && !env.ACT }}
        run: |
          git add results
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "results: EasyLocal $LABEL"
          git pull -q --rebase
          git push -q

      - name: Rebuild the EasyLocal documentation
        if: ${{ env.PUBLISH == 'true' && !env.ACT }}
        env:
          GH_TOKEN: ${{ secrets.EASYLOCAL_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::notice::EASYLOCAL_TOKEN is not set: the EasyLocal documentation shows the results at its next build.'
            exit 0
          fi
          gh workflow run docs.yml --repo iolab-uniud/easylocal --ref main
