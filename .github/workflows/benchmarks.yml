name: Benchmarks

# EasyLocal 4 against EasyLocal 3 on the example problems, and the EasyLocal
# infrastructure benchmarks; results committed to results/<version>/.
#
# One job per responsibility, run one after the other:
#   prepare      the EasyLocal commit to measure and the label of the results;
#   el3-vs-el4   EasyLocal 3 (easylocal-legacy v3.4.1) and EasyLocal 4 on the
#                matrix of el3_vs_el4/, in the same job, on the same machine,
#                alternating run by run and repeating each run three times:
#                shared runners differ by up to a factor of two between
#                machines and drift within one, so a speed-up is only
#                computed between results measured together;
#   neighborhood neighborhood traversal and runner-level search;
#   trace        tracing overhead and ELTR cost encoding;
#   platforms    the EasyLocal 4 driver of the matrix built by several
#                toolchains, one job per platform (Linux x86_64 and ARM64,
#                macOS ARM64, Windows x86_64), its toolchains alternating run
#                by run; a platform that fails is left out of the results;
#   publish      merges the parts into results/<label>/, commits them and
#                rebuilds the EasyLocal documentation.
# Each part records the machine it ran on. A manual run may measure one part
# only; publishing it replaces that part's files and keeps the others.
#
# Secrets: EASYLOCAL_TOKEN (optional), a token allowed to start workflows of
# iolab-uniud/easylocal, to rebuild its documentation after a publication.

on:
  repository_dispatch:
    types: [easylocal-release]
  workflow_dispatch:
    inputs:
      easylocal_ref:
        description: 'EasyLocal tag, branch or commit to measure'
        type: string
        default: main
      label:
        description: 'Label of the results (default: the tag, or <ref>-<commit>)'
        type: string
        default: ''
      parts:
        description: 'Parts to measure'
        type: choice
        options: [all, el3-vs-el4, neighborhood, trace, platforms]
        default: all
      publish:
        description: 'Commit the results'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: benchmarks
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TOOLCHAIN: gcc16
  CXX: /usr/bin/g++-16
  # A release measures everything.
  PARTS: ${{ inputs.parts || 'all' }}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.label.outputs.commit }}
      label: ${{ steps.label.outputs.label }}
    steps:
      - name: Checkout EasyLocal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: iolab-uniud/easylocal
          ref: ${{ github.event.client_payload.ref || inputs.easylocal_ref || 'main' }}
          path: easylocal
          persist-credentials: false

      - name: Label
        id: label
        env:
          EASYLOCAL_REF: ${{ github.event.client_payload.ref || inputs.easylocal_ref || 'main' }}
          INPUT_LABEL: ${{ inputs.label }}
        run: |
          commit="$(git -C easylocal rev-parse HEAD)"
          short="$(git -C easylocal rev-parse --short HEAD)"
          if [ -n "$INPUT_LABEL" ]; then
            label="$INPUT_LABEL"
          elif git -C easylocal tag --points-at HEAD | grep -qx "$EASYLOCAL_REF"; then
            label="$EASYLOCAL_REF"
          else
            label="${EASYLOCAL_REF//\//-}-$short"
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "EasyLocal $EASYLOCAL_REF ($short): $label, parts: $PARTS"

  el3-vs-el4:
    name: EasyLocal 3 versus EasyLocal 4
    needs: prepare
    if: ${{ contains(fromJSON('["all", "el3-vs-el4"]'), inputs.parts || 'all') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      LABEL: ${{ needs.prepare.outputs.label }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up
        uses: ./.github/actions/setup
        with:
          easylocal_commit: ${{ needs.prepare.outputs.commit }}
          packages: libboost-program-options-dev

      - name: Build the drivers
        run: |
          mkdir -p build
          curl -fsSL https://github.com/iolab-uniud/easylocal-legacy/archive/refs/tags/v3.4.1.tar.gz \
            | tar -xz -C build
          cmake -S el3_vs_el4/el3 -B build/el3 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DEL3_SOURCE_DIR="$PWD/build/easylocal-legacy-3.4.1"
          cmake --build build/el3 --parallel 2
          cmake -S el3_vs_el4/el4 -B build/el4 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DEASYLOCAL_SOURCE_DIR="$PWD/easylocal"
          cmake --build build/el4 --parallel 2

      - name: Run the matrix
        run: |
          out="build/results/$LABEL"
          python3 scripts/machine-metadata.py \
            --output "$out/el3-vs-el4-metadata.csv" --repo-root easylocal
          python3 scripts/cpu-time.py start build/cpu-time.json
          python3 scripts/el3-vs-el4.py run \
            --el3 build/el3/el3_comparison --el4 build/el4/el4_comparison \
            --output "$out" --repetitions 3 \
            --toolchain "$TOOLCHAIN" --label "$LABEL"
          python3 scripts/cpu-time.py stop build/cpu-time.json "$out/el3-vs-el4-metadata.csv"
          rm -rf "$out/instances"

      - name: Upload the results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-el3-vs-el4
          retention-days: 30
          path: build/results/

  neighborhood:
    name: Neighborhood traversal and search
    needs: [prepare, el3-vs-el4]
    # After the previous part, also when it was not selected.
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success'
          && contains(fromJSON('["all", "neighborhood"]'), inputs.parts || 'all') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      LABEL: ${{ needs.prepare.outputs.label }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up
        uses: ./.github/actions/setup
        with:
          easylocal_commit: ${{ needs.prepare.outputs.commit }}

      - name: Run the benchmarks
        run: |
          results="$PWD/build/results/$LABEL/infrastructure"
          EASYLOCAL_SOURCE_DIR="$PWD/easylocal" BENCHMARK_BUILD_DIR="$PWD/build/neighborhood" \
            ./scripts/run-neighborhood-benchmarks.sh "$results" 1000000 3 123456789
          rm -f "$results"/*.log "$results/summary.md"

      - name: Upload the results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-neighborhood
          retention-days: 30
          path: build/results/

  trace:
    name: Tracing
    needs: [prepare, neighborhood]
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success'
          && contains(fromJSON('["all", "trace"]'), inputs.parts || 'all') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      LABEL: ${{ needs.prepare.outputs.label }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up
        uses: ./.github/actions/setup
        with:
          easylocal_commit: ${{ needs.prepare.outputs.commit }}

      - name: Run the benchmarks
        run: |
          results="$PWD/build/results/$LABEL/infrastructure"
          EASYLOCAL_SOURCE_DIR="$PWD/easylocal" BENCHMARK_BUILD_DIR="$PWD/build/trace" \
            ./scripts/run-trace-benchmarks.sh "$results" 5
          rm -f "$results"/*.log

      - name: Upload the results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-trace
          retention-days: 30
          path: build/results/

  platforms:
    name: Platforms / ${{ matrix.platform }}
    needs: prepare
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success'
          && contains(fromJSON('["all", "platforms"]'), inputs.parts || 'all') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # A platform that fails (a toolchain that does not build, a runner that
    # is not available) is left out; the others are published.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-26.04
            toolchains: gcc16 clang23-libstdcxx clang23-libcxx
          - platform: linux-arm64
            runner: ubuntu-26.04-arm
            toolchains: gcc16 clang23-libstdcxx clang23-libcxx
          - platform: macos-arm64
            runner: macos-26
            toolchains: appleclang
          - platform: windows-x86_64
            runner: windows-2025
            toolchains: clang-cl msvc
    env:
      LABEL: ${{ needs.prepare.outputs.label }}
      PLATFORM: ${{ matrix.platform }}
      TOOLCHAINS: ${{ matrix.toolchains }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout EasyLocal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: iolab-uniud/easylocal
          ref: ${{ needs.prepare.outputs.commit }}
          path: easylocal
          persist-credentials: false

      - name: Install the build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get install -y --no-install-recommends cmake ninja-build

      - name: Install the build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v cmake >/dev/null || brew install cmake
          command -v ninja >/dev/null || brew install ninja

      - name: Provision clang-cl and the MSVC environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The newest LLVM (clang-cl) and Ninja; the Microsoft STL, Windows
          # SDK, linker and cl.exe come from the Visual Studio developer
          # environment, exported to the next steps.
          choco upgrade llvm ninja -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      - name: Build the drivers
        run: |
          # One driver per toolchain; a toolchain that does not build is
          # left out with a warning.
          drivers=()
          for toolchain in $TOOLCHAINS; do
            SDKROOT=
            if [ "$RUNNER_OS" = Windows ]; then
              case "$toolchain" in
                clang-cl) CXX="C:/Program Files/LLVM/bin/clang-cl.exe" ;;
                msvc) CXX=cl ;;
                *) echo "::error::unknown Windows toolchain $toolchain"; exit 1 ;;
              esac
              CXXFLAGS=
              exe=.exe
            else
              eval "$(scripts/toolchain-env.sh "$toolchain")"
              exe=
            fi
            # CXXFLAGS from the environment: CMake adds them to its own
            # defaults (/EHsc with clang-cl and MSVC), which -DCMAKE_CXX_FLAGS
            # would replace.
            export CXX CXXFLAGS
            if cmake -S el3_vs_el4/el4 -B "build/$toolchain" -G Ninja \
                 -DCMAKE_BUILD_TYPE=Release \
                 ${SDKROOT:+-DCMAKE_OSX_SYSROOT="$SDKROOT"} \
                 -DEASYLOCAL_SOURCE_DIR="$PWD/easylocal" \
               && cmake --build "build/$toolchain" --parallel 2; then
              drivers+=("--driver" "$toolchain=$PWD/build/$toolchain/el4_comparison$exe")
              "build/$toolchain/el4_comparison$exe" --describe
            else
              echo "::warning::$toolchain does not build EasyLocal $LABEL on $PLATFORM: left out"
            fi
          done
          if [ "${#drivers[@]}" -eq 0 ]; then
            echo "::error::no toolchain builds EasyLocal $LABEL on $PLATFORM"
            exit 1
          fi
          echo "DRIVERS=${drivers[*]}" >> "$GITHUB_ENV"

      - name: Run the matrix
        run: |
          out="build/results/$LABEL/platforms/$PLATFORM"
          python3 scripts/machine-metadata.py --machine-only \
            --output "$out/metadata.csv" --repo-root easylocal
          python3 scripts/cpu-time.py start build/cpu-time.json
          # shellcheck disable=SC2086 # DRIVERS is a list of --driver options
          python3 scripts/platforms.py run --platform "$PLATFORM" $DRIVERS \
            --output "$out" --repetitions 3 --label "$LABEL"
          python3 scripts/cpu-time.py stop build/cpu-time.json "$out/metadata.csv"
          rm -rf "$out/instances"

      - name: Upload the results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-platforms-${{ matrix.platform }}
          retention-days: 30
          path: build/results/

  publish:
    name: Publish
    needs: [prepare, el3-vs-el4, neighborhood, trace, platforms]
    # When every selected part succeeded.
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success'
          && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write  # results/
    env:
      LABEL: ${{ needs.prepare.outputs.label }}
      PUBLISH: ${{ github.event_name == 'repository_dispatch' || inputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: results-*
          merge-multiple: true
          path: build/results

      - name: Add them to results/
        run: |
          # The parts measured replace their files; the others stay.
          if [ ! -d "build/results/$LABEL" ]; then
            echo "::error::no part produced results for $LABEL"
            exit 1
          fi
          mkdir -p "results/$LABEL"
          cp -R "build/results/$LABEL/." "results/$LABEL/"
          python3 scripts/summarize.py results --output build/benchmarks.md
          cat build/benchmarks.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the results
        if: ${{ env.PUBLISH == 'true' && !env.ACT }}
        run: |
          # The identity also for the rebase, when main moved meanwhile.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git commit -q -m "results: EasyLocal $LABEL ($PARTS)"
          git pull -q --rebase
          git push -q

      - name: Rebuild the EasyLocal documentation
        if: ${{ env.PUBLISH == 'true' && !env.ACT }}
        env:
          GH_TOKEN: ${{ secrets.EASYLOCAL_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::notice::EASYLOCAL_TOKEN is not set: the EasyLocal documentation shows the results at its next build.'
            exit 0
          fi
          gh workflow run docs.yml --repo iolab-uniud/easylocal --ref main
