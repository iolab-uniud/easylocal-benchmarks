name: Benchmarks

# EasyLocal 4 against EasyLocal 3 on the example problems, and the EasyLocal
# infrastructure benchmarks; results committed to results/<version>/.
#
# EasyLocal 3 (easylocal-legacy v3.3.1) and EasyLocal 4 are measured in the
# same job, on the same machine, alternating run by run and repeating each
# run three times: shared runners differ by up to a factor of two between
# machines and drift within one, so a speed-up is only computed between
# results measured together.
#
# Secrets: EASYLOCAL_TOKEN (optional), a token allowed to start workflows of
# iolab-uniud/easylocal, to rebuild its documentation after a publication.

on:
  repository_dispatch:
    types: [easylocal-release]
  workflow_dispatch:
    inputs:
      easylocal_ref:
        description: 'EasyLocal tag, branch or commit to measure'
        type: string
        default: main
      label:
        description: 'Label of the results (default: the tag, or <ref>-<commit>)'
        type: string
        default: ''
      publish:
        description: 'Commit the results'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: benchmarks
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TOOLCHAIN: gcc16
  CXX: /usr/bin/g++-16
  EASYLOCAL_REF: ${{ github.event.client_payload.ref || inputs.easylocal_ref || 'main' }}

jobs:
  measure:
    name: Measure
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    outputs:
      label: ${{ steps.label.outputs.label }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout EasyLocal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: iolab-uniud/easylocal
          ref: ${{ env.EASYLOCAL_REF }}
          path: easylocal
          persist-credentials: false

      - name: Label
        id: label
        env:
          INPUT_LABEL: ${{ inputs.label }}
        run: |
          commit="$(git -C easylocal rev-parse --short HEAD)"
          if [ -n "$INPUT_LABEL" ]; then
            label="$INPUT_LABEL"
          elif git -C easylocal tag --points-at HEAD | grep -qx "$EASYLOCAL_REF"; then
            label="$EASYLOCAL_REF"
          else
            label="${EASYLOCAL_REF//\//-}-$commit"
          fi
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "EasyLocal $EASYLOCAL_REF ($commit): $label"

      - name: Install the toolchain
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get install -y --no-install-recommends \
              cmake ninja-build g++-16 libboost-program-options-dev
          lscpu | sed -n '/^Model name/p;/^CPU(s)/p'

      - name: Build the drivers
        run: |
          mkdir -p build
          curl -fsSL https://github.com/iolab-uniud/easylocal-legacy/archive/refs/tags/v3.3.1.tar.gz \
            | tar -xz -C build
          cmake -S el3_vs_el4/el3 -B build/el3 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DEL3_SOURCE_DIR="$PWD/build/easylocal-legacy-3.3.1"
          cmake --build build/el3 --parallel 2
          cmake -S el3_vs_el4/el4 -B build/el4 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DEASYLOCAL_SOURCE_DIR="$PWD/easylocal"
          cmake --build build/el4 --parallel 2

      - name: Run the matrix
        env:
          LABEL: ${{ steps.label.outputs.label }}
        run: |
          out="build/results/$LABEL"
          python3 scripts/el3-vs-el4.py run \
            --el3 build/el3/el3_comparison --el4 build/el4/el4_comparison \
            --output "$out" --repetitions 3 \
            --toolchain "$TOOLCHAIN" --label "$LABEL"
          rm -rf "$out/instances"

      - name: Infrastructure benchmarks
        env:
          LABEL: ${{ steps.label.outputs.label }}
        run: |
          results="$PWD/build/results/$LABEL/infrastructure"
          build="$PWD/build/infrastructure"
          EASYLOCAL_SOURCE_DIR="$PWD/easylocal" BENCHMARK_BUILD_DIR="$build" \
            ./scripts/run-neighborhood-benchmarks.sh "$results" 1000000 3 123456789
          cmake --build "$build" --target easylocal_trace_benchmark
          echo 'trial,mode,ns_per_evaluation,checksum' > "$results/trace.csv"
          for trial in 1 2 3 4 5; do
            "$build/easylocal_trace_benchmark" 2>> "$results/trace.log" \
              | tail -n +2 | sed "s/^/$trial,/" >> "$results/trace.csv"
          done
          rm -f "$results"/*.log "$results/summary.md"

      - name: Upload the results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results
          retention-days: 30
          path: build/results/

  publish:
    name: Publish
    needs: measure
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write  # results/
    env:
      LABEL: ${{ needs.measure.outputs.label }}
      PUBLISH: ${{ github.event_name == 'repository_dispatch' || inputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: results
          path: build/results

      - name: Add them to results/
        run: |
          rm -rf "results/$LABEL"
          cp -R "build/results/$LABEL" "results/$LABEL"
          python3 scripts/summarize.py results --output build/benchmarks.md
          cat build/benchmarks.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the results
        if: ${{ env.PUBLISH == 'true' && !env.ACT }}
        run: |
          git add results
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "results: EasyLocal $LABEL"
          git pull -q --rebase
          git push -q

      - name: Rebuild the EasyLocal documentation
        if: ${{ env.PUBLISH == 'true' && !env.ACT }}
        env:
          GH_TOKEN: ${{ secrets.EASYLOCAL_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::notice::EASYLOCAL_TOKEN is not set: the EasyLocal documentation shows the results at its next build.'
            exit 0
          fi
          gh workflow run docs.yml --repo iolab-uniud/easylocal --ref main
